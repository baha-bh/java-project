spring:
  application:
    name: normocontrol

  # PostgreSQL Database (Supabase)
  datasource:
    url: jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require
    username: postgres.badawaighvqpegsxfvdc
    password: ${SUPABASE_DB_PASSWORD:20050805BhbhBh}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # Redis Cache
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 6000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # Supabase Auth
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://badawaighvqpegsxfvdc.supabase.co/auth/v1

  # Servlet
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Server
server:
  port: 8080
  servlet:
    context-path: /

# Logging
logging:
  level:
    root: INFO
    com.normocontrol: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Application specific
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8080
  analysis:
    temp-dir: /tmp/normocontrol/analysis
    max-file-size: 10485760